name: Build agent-langgraph image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream CopilotKit/openbot ref to build
        required: true
        default: v0.0.5

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upstream OpenBot
        uses: actions/checkout@v4
        with:
          repository: CopilotKit/openbot
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent-langgraph
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-langgraph/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/will-bogusz/openbot-agent-langgraph:${{ inputs.ref }}
            ghcr.io/will-bogusz/openbot-agent-langgraph:0bb2f634bd5e5141c421aefa56620b60fb5e4e94
          labels: |
            org.opencontainers.image.source=https://github.com/CopilotKit/openbot
            org.opencontainers.image.revision=0bb2f634bd5e5141c421aefa56620b60fb5e4e94
            org.opencontainers.image.version=v0.0.5
            org.opencontainers.image.description=agent-langgraph from CopilotKit/openbot v0.0.5, built for the Railway template
            org.opencontainers.image.licenses=MIT
